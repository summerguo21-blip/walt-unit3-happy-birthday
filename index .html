<title>五上 Unit 3 Happy birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: a single phone-width "paper" column — chapter cover → one question per page → a letter-style report */
:root{
  --bg:#f3efe6; --paper:#fbf9f4; --ink:#1f1e1c; --soft:#5f5b53; --faint:#9a958a; --line:#e3ddd0;
  --clay:#c2613f; --clay-soft:#f2e2d8; --sage:#4f7350; --sage-soft:#e4ece0; --brick:#a5443a; --brick-soft:#f4e1dc;
  --gold:#d9a521;
  --serif-cn:"Noto Serif SC","Songti SC","STSong",serif;
  --serif-en:"Newsreader","Iowan Old Style","Georgia",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#252422; --paper:#2f2e2b; --ink:#f1ede4; --soft:#c4beb2; --faint:#8f897d; --line:#45423d;
  --clay:#de8463; --clay-soft:#4a3329; --sage:#93b98f; --sage-soft:#2f3b2d; --brick:#e48a7c; --brick-soft:#4a2e2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#252422; --paper:#2f2e2b; --ink:#f1ede4; --soft:#c4beb2; --faint:#8f897d; --line:#45423d;
  --clay:#de8463; --clay-soft:#4a3329; --sage:#93b98f; --sage-soft:#2f3b2d; --brick:#e48a7c; --brick-soft:#4a2e2a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-inline:20px;padding-block:20px 36px;min-height:100%}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:20px;width:auto}
.brand .ed{font-family:var(--serif-en);font-style:italic;font-size:13px;color:var(--faint)}
.logo-l{display:block}.logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
.en{font-family:var(--serif-en)}
.cn-serif{font-family:var(--serif-cn)}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* cover */
.cover{padding-top:36px}
.eyebrow{font-family:var(--serif-en);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay)}
.title{font-family:var(--serif-en);font-weight:400;font-size:clamp(40px,12.5vw,60px);line-height:1;letter-spacing:-.02em;margin:10px 0 0}
.title-cn{font-family:var(--serif-cn);font-weight:500;font-size:20px;color:var(--soft);margin-top:10px;letter-spacing:.2em}
.art{margin:22px 0 4px;width:100%;height:auto;display:block}
.art .stroke{stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.art .sun{stroke:var(--clay);fill:none;stroke-width:1.6;stroke-linecap:round}
.art .sunfill{fill:var(--clay-soft)}
.art text{font-family:var(--serif-en);font-style:italic;font-size:13px;fill:var(--soft)}
.lead{font-family:var(--serif-cn);font-size:16px;color:var(--soft);line-height:1.9;margin:12px 0 0}
.meta{display:flex;gap:18px;margin-top:18px;font-size:13px;color:var(--faint)}
.meta b{font-family:var(--serif-en);font-weight:500;font-size:22px;color:var(--ink);display:block;line-height:1.1}
.sign{margin-top:28px}
.sign label{display:block;font-size:13px;color:var(--faint)}
.sign input{width:100%;font-family:var(--serif-cn);font-size:22px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:8px 0;border-radius:0}
.sign input:focus{outline:none;border-bottom-color:var(--clay)}
.sign input::placeholder{color:var(--faint);opacity:.7}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;font:inherit;font-size:16px;font-weight:600;padding:15px 18px;border-radius:999px;background:var(--ink);color:var(--paper);cursor:pointer;margin-top:22px}
.btn.clay{background:var(--clay);color:#fff}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.35}
.btn .arr{font-family:var(--serif-en);font-size:18px}
.tip-sound{font-size:12.5px;color:var(--faint);margin-top:12px;text-align:center}

/* question */
.qhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:26px}
.qno{font-family:var(--serif-en);font-size:34px;line-height:1;letter-spacing:-.01em}
.qno small{font-size:15px;color:var(--faint);margin-left:2px}
.qcat{font-size:12.5px;color:var(--clay);letter-spacing:.12em}
.dots{display:flex;gap:4px;margin-top:12px}
.dots i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.cur{background:var(--clay)}
.qbody{margin-top:28px}
.qtext{font-family:var(--serif-cn);font-weight:500;font-size:21px;line-height:1.6}
.quote{margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.quote .q{font-family:var(--serif-en);font-style:italic;font-size:24px;line-height:1.3}
.play{appearance:none;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--clay);display:grid;place-items:center;cursor:pointer}
.play svg{width:18px;height:18px}
.big{font-size:64px;line-height:1.1;text-align:center;margin:18px 0 0}
.swatch{width:96px;height:96px;border-radius:50%;margin:18px auto 0;border:1px solid var(--line)}
.listen{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.listen .play{width:78px;height:78px;background:var(--clay);color:#fff;border:0}
.listen .play svg{width:30px;height:30px}
.listen .cap{font-size:12.5px;color:var(--faint)}
.reveal{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;color:var(--soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.revealed{font-family:var(--serif-en);font-style:italic;font-size:22px}
.opts{margin-top:22px;display:flex;flex-direction:column}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--line);padding:16px 4px;display:flex;align-items:center;gap:16px;cursor:pointer;min-width:0}
.opt:last-child{border-bottom:1px solid var(--line)}
.opt .k{flex:none;font-family:var(--serif-en);font-style:italic;font-size:18px;color:var(--faint);width:18px}
.opt .t{font-size:18px;line-height:1.45}
.opt .t.e{font-family:var(--serif-en);font-size:20px}
.opt .mark{margin-left:auto;font-size:14px;flex:none}
.opt.ok{background:var(--sage-soft)} .opt.ok .k,.opt.ok .mark{color:var(--sage)}
.opt.no{background:var(--brick-soft)} .opt.no .k,.opt.no .mark{color:var(--brick)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.45}
.slot{margin-top:22px;min-height:64px;padding:12px 0;border-bottom:1.5px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot.ok{border-color:var(--sage)} .slot.no{border-color:var(--brick)}
.slot .ph{font-size:13px;color:var(--faint)}
.slot .end{font-family:var(--serif-en);font-size:22px}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.w{appearance:none;font-family:var(--serif-en);font-size:20px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.w.used{visibility:hidden}
.note{margin-top:20px;padding:4px 0 4px 16px;border-left:2px solid var(--clay)}
.note.ok{border-left-color:var(--sage)} .note.no{border-left-color:var(--brick)}
.note h4{margin:0;font-family:var(--serif-cn);font-weight:500;font-size:16px}
.note.ok h4{color:var(--sage)} .note.no h4{color:var(--brick)}
.note p{margin:4px 0 0;font-size:14.5px;color:var(--soft)}
.note .ans{font-family:var(--serif-en);font-style:italic;font-size:17px;color:var(--ink)}
.back{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--faint);cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:3px}

/* report */
.report{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px 22px 22px;position:relative}
.report .dear{font-family:var(--serif-cn);font-size:18px}
.report .score{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.report .score b{font-family:var(--serif-en);font-weight:400;font-size:88px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.report .score span{font-family:var(--serif-cn);color:var(--soft)}
.suns{display:flex;gap:8px;margin-top:10px}
.suns svg{width:26px;height:26px}
.suns .on circle,.suns .on path{stroke:var(--clay)} .suns .on circle{fill:var(--clay-soft)}
.suns .off circle,.suns .off path{stroke:var(--line)} .suns .off circle{fill:none}
.words{font-family:var(--serif-cn);font-size:17px;line-height:1.9;margin-top:14px;color:var(--ink)}
.stamp{position:absolute;right:18px;top:22px;width:92px;height:92px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;text-align:center;transform:rotate(-10deg);color:var(--gold)}
.stamp::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed var(--gold)}
.stamp b{font-family:var(--serif-cn);font-size:13px;line-height:1.3;display:block}
.stamp i{font-family:var(--serif-en);font-style:normal;font-size:30px;line-height:1}
.skills{margin-top:20px;border-top:1px solid var(--line)}
.sk{display:grid;grid-template-columns:3.5em 1fr 2.6em;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sk .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.sk .bar i{display:block;height:100%;background:var(--ink)}
.sk .n{text-align:right;font-family:var(--serif-en);font-variant-numeric:tabular-nums;color:var(--soft)}
.coin{margin-top:18px;font-size:13.5px;color:var(--soft)}
.coin b{color:var(--ink)}
.sigline{display:flex;justify-content:space-between;gap:8px;margin-top:22px;font-size:12px;color:var(--faint)}
.sigline .en{font-style:italic}
h3{font-family:var(--serif-cn);font-weight:500;font-size:18px;margin:32px 0 6px}
.wr{padding:14px 0;border-bottom:1px solid var(--line)}
.wr .q{font-size:14.5px}
.wr .y{font-size:14px;color:var(--brick);margin-top:4px}
.wr .a{font-size:14px;color:var(--sage)}
.wr .y .en,.wr .a .en,.wr .q .en{font-style:italic;font-size:16px}
.foot{margin-top:36px;text-align:center;font-size:12px;color:var(--faint)}
.foot .en{font-style:italic}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease-out}
@media (prefers-reduced-motion: reduce){.rise{animation:none}}
</style>

const CFG = {"unit": {"key": "walt_g5_u3", "no": 3, "label": "Unit 3", "eyebrow": "Unit 3 · 单元自查", "en": "Happy birthday", "cn": "生日快乐", "artLabel": "一个插着蜡烛的生日蛋糕", "gradeCn": "五上"}, "art": "<rect class=\"stroke\" x=\"170\" y=\"80\" width=\"100\" height=\"40\" rx=\"4\"/><rect class=\"stroke\" x=\"185\" y=\"56\" width=\"70\" height=\"24\" rx=\"3\"/><path class=\"stroke\" d=\"M205 56v-14M220 56v-14M235 56v-14\"/><path class=\"sunfill\" d=\"M205 40c-3-4 0-9 0-9s3 5 0 9zM220 40c-3-4 0-9 0-9s3 5 0 9zM235 40c-3-4 0-9 0-9s3 5 0 9z\"/><path class=\"sun\" d=\"M205 40c-3-4 0-9 0-9s3 5 0 9zM220 40c-3-4 0-9 0-9s3 5 0 9zM235 40c-3-4 0-9 0-9s3 5 0 9z\"/><path class=\"stroke\" d=\"M170 96q12 8 25 0t25 0t25 0t25 0\"/><text x=\"40\" y=\"60\">When is<\/text><text x=\"40\" y=\"78\">your birthday?<\/text><text x=\"310\" y=\"60\">It's on<\/text><text x=\"310\" y=\"78\">October 7.<\/text><text x=\"160\" y=\"144\">Make a wish!<\/text>", "lead": "<i class=\"en\">When is your birthday?<\/i> 说生日在几月几号、过生日做什么，还要会用过去式讲一次生日派对——来看看吧。", "words": ["月份、in / on、生日活动和过去式，你全都掌握了。用英语讲讲你最难忘的一次生日吧。", "只差一点点就满分了。把下面的错题再读一遍，弄懂了再来挑战满分。", "大部分都掌握了。错的几题，回到课本 P25–36 再读一读。", "已经会了一半。把十二个月份和 sang / made / ate / drew 各读三遍，明天再来测一次。", "别着急，和老师一起把这一单元再学一遍，下次一定更好。"], "qs": [{"t": "c", "tag": "词汇", "q": "present 的意思是：", "o": ["礼物", "派对", "蛋糕"], "a": 0, "tip": "present 礼物，party 派对，cake 蛋糕。"}, {"t": "c", "tag": "词汇", "q": "“十月”用英语怎么说？", "o": ["October", "August", "April"], "a": 0, "tip": "October 十月，August 八月，April 四月。"}, {"t": "l", "tag": "词汇", "q": "听一听，选出你听到的月份。", "say": "March", "o": ["March", "May", "April"], "a": 0, "tip": "March，三月。"}, {"t": "c", "tag": "句型", "q": "When is your birthday? 正确回答是：", "o": ["It's in March.", "It's Saturday.", "I'm ten."], "a": 0, "tip": "问生日在什么时候，用 It's in + 月份 / It's on + 日期。"}, {"t": "c", "tag": "语法", "q": "My birthday is ____ October 7.", "o": ["on", "in", "at"], "a": 0, "tip": "具体到哪一天，用 on。"}, {"t": "c", "tag": "语法", "q": "Li Ming's birthday is ____ March.", "o": ["in", "on", "at"], "a": 0, "tip": "只说月份，用 in。"}, {"t": "c", "tag": "情景", "q": "同学送你礼物说 Here's a present for you. 你想马上打开，说：", "o": ["Thanks! Can I open it?", "Make a wish.", "Try again."], "a": 0, "tip": "Thanks! Can I open it? 谢谢！我能打开吗？"}, {"t": "c", "tag": "情景", "q": "生日蛋糕上的蜡烛点好了，大家对寿星说：", "o": ["Make a wish!", "Don't worry.", "Our pleasure!"], "a": 0, "tip": "make a wish 许愿。"}, {"t": "l", "tag": "句型", "q": "听一听，选出最合适的回答。", "say": "What do you do on your birthday?", "o": ["I usually have a party.", "It's in May.", "Yes, I do."], "a": 0, "tip": "问生日做什么，用 I usually… 回答。"}, {"t": "c", "tag": "语法", "q": "sing 的过去式是：", "o": ["sang", "singed", "sings"], "a": 0, "tip": "sing → sang，不规则变化，要单独记。"}, {"t": "c", "tag": "语法", "q": "Last Sunday, her brother ____ a nice picture for Grandma.", "o": ["drew", "draws", "draw"], "a": 0, "tip": "last Sunday 是过去 → draw 的过去式 drew。"}, {"t": "c", "tag": "语法", "q": "They ____ noodles and sang “Happy Birthday” to Grandma.", "o": ["ate", "eat", "eats"], "a": 0, "tip": "说上周日的事，用 eat 的过去式 ate。"}, {"t": "c", "tag": "语音", "q": "哪个单词里的 or 和 fork 读音相同？", "o": ["short", "work", "cap"], "a": 0, "tip": "or、oor 常读 /ɔː/，如 fork、York、floor、door；work 里的 or 读 /ɜː/。"}, {"t": "c", "tag": "语法", "q": "four → fourth（第四）。twelve 的序数词“第十二”是：", "o": ["twelfth", "twelveth", "twelve"], "a": 0, "tip": "twelve 变 twelfth：去掉 ve，加 fth。five → fifth 也一样。"}, {"t": "c", "tag": "文化", "q": "我们的国庆节（National Day）是哪一天？", "o": ["October 1", "July 4", "June 12"], "a": 0, "tip": "中国 10 月 1 日；美国 7 月 4 日；俄罗斯 6 月 12 日。"}, {"t": "o", "tag": "句型", "q": "把单词排成一句话。", "w": ["When", "is", "your", "birthday"], "end": "?", "tip": "When is your birthday? 你的生日是什么时候？"}, {"t": "o", "tag": "句型", "q": "把单词排成一句话。", "w": ["They", "sang", "the", "birthday", "song", "to", "Grandma"], "end": ".", "tip": "They sang the birthday song to Grandma. 他们给奶奶唱了生日歌。"}]};
const UNIT = CFG.unit;
/* t: c 选择 / l 听音 / o 连词成句 */
const QS = CFG.qs;

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isEn = s => /[a-z]/i.test(s) && !/[一-龥]/.test(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const KEY = UNIT.key;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const hasTTS = "speechSynthesis" in window;
let voice=null;
function pickVoice(){ if(!hasTTS) return; const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }
if(hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ if(!hasTTS) return false; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voice) u.voice=voice; u.lang=voice?voice.lang:"en-GB"; u.rate=.8; speechSynthesis.speak(u); return true; }catch(e){ return false; } }
const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const sunSvg = on => `<svg viewBox="0 0 26 26" class="${on?"on":"off"}"><circle cx="13" cy="13" r="5.5" stroke-width="1.5"/><path d="M13 2.5v3M13 20.5v3M2.5 13h3M20.5 13h3M5.6 5.6l2.1 2.1M18.3 18.3l2.1 2.1M5.6 20.4l2.1-2.1M18.3 7.7l2.1-2.1" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>`;

let S=null;

function cover(){
  S=null;
  const best = store.get(KEY+"_best", null);
  app.innerHTML = `
  <section class="cover rise">
    <div class="eyebrow">${UNIT.eyebrow}</div>
    <h1 class="title">${UNIT.en}</h1>
    <div class="title-cn">${UNIT.cn}</div>
    <svg class="art" viewBox="0 0 440 150" role="img" aria-label="${UNIT.artLabel}">${CFG.art}</svg>
    <p class="lead">${CFG.lead}</p>
    <div class="meta">
      <div><b>${QS.length}</b>道题</div>
      <div><b>${QS.filter(x=>x.t==="l").length}</b>道听力</div>
      <div><b>~${Math.round(QS.length*0.4)}</b>分钟</div>
      ${best!=null?`<div><b>${best}</b>上次最好</div>`:""}
    </div>
    <div class="sign">
      <label for="name">写下你的名字</label>
      <input id="name" maxlength="12" placeholder="王小明" value="${esc(store.get("walt_g3_name",""))}" autocomplete="off">
    </div>
    <button class="btn clay" id="go">开始自查 <span class="arr">→</span></button>
    <div class="tip-sound">听力题会朗读英语，请打开手机声音</div>
  </section>`;
  $("#name").oninput = e => store.set("walt_g3_name", e.target.value.trim());
  $("#go").onclick = ()=>{ store.set("walt_g3_name",$("#name").value.trim()); S={i:0,ans:[],name:$("#name").value.trim()}; q(); };
}

function q(){
  const i=S.i, it=QS[i], n=QS.length;
  let mid="";
  if(it.big) mid+=`<div class="big" aria-hidden="true">${it.big}</div>`;
  if(it.sw) mid+=`<div class="swatch" style="background:${it.sw}" role="img" aria-label="颜色色块"></div>`;
  if(it.t==="c" && it.say) mid+=`<div class="quote"><button class="play" data-say="${esc(it.say)}" aria-label="朗读">${ICON_PLAY}</button><span class="q">${esc(it.say)}</span></div>`;
  if(it.t==="l") mid+=`<div class="listen"><button class="play" data-say="${esc(it.say)}" aria-label="播放">${ICON_PLAY}</button><span class="cap">点一下，听一听</span><button class="reveal" id="rv">${hasTTS?"听不清？看文字":"这台手机不能朗读，点这里看文字"}</button><span class="revealed" id="ht" hidden>${esc(it.say)}</span></div>`;
  let ans="";
  if(it.t==="o"){
    const pool=shuffle(it.w.map((w,k)=>({w,k})));
    ans=`<div class="slot" id="slot"><span class="ph">依次点下面的单词</span></div>
      <div class="pool" id="pool">${pool.map(p=>`<button class="w" data-k="${p.k}">${esc(p.w)}</button>`).join("")}</div>
      <button class="btn" id="check" disabled>检查</button>`;
  }else{
    const ord=shuffle(it.o.map((_,k)=>k));
    ans=`<div class="opts">${ord.map((k,j)=>`<button class="opt" data-k="${k}"><span class="k">${"abc"[j]}</span><span class="t ${isEn(it.o[k])?"e":""}">${esc(it.o[k])}</span><span class="mark"></span></button>`).join("")}</div>`;
  }
  app.innerHTML=`
    <div class="qhead">
      <span class="qno">${String(i+1).padStart(2,"0")}<small>/ ${n}</small></span>
      <span class="qcat">${esc(it.tag)}</span>
    </div>
    <div class="dots" aria-hidden="true">${QS.map((_,k)=>`<i class="${k<i?"done":k===i?"cur":""}"></i>`).join("")}</div>
    <section class="qbody rise">
      <div class="qtext">${esc(it.q)}</div>
      ${mid}${ans}
      <div id="fb"></div>
    </section>`;
  app.querySelectorAll(".play").forEach(b=>b.onclick=()=>{ if(!speak(b.dataset.say)){ const h=$("#ht"); if(h) h.hidden=false; } });
  const rv=$("#rv"); if(rv) rv.onclick=()=>{ $("#ht").hidden=false; rv.hidden=true; };
  it.t==="o" ? bindOrder(it) : bindChoice(it);
  window.scrollTo({top:0});
}

function bindChoice(it){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, ok=k===it.a;
    app.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===it.a){ x.classList.add("ok"); x.querySelector(".mark").textContent="✓"; } });
    if(!ok){ b.classList.add("no"); b.querySelector(".mark").textContent="✗"; }
    done(ok, it.o[k], it.o[it.a], it);
  });
}
function bindOrder(it){
  const slot=$("#slot"), pool=$("#pool"), chk=$("#check"); let seq=[];
  const render=()=>{
    slot.innerHTML = seq.length ? seq.map((k,j)=>`<button class="w" data-j="${j}">${esc(it.w[k])}</button>`).join("")+(seq.length===it.w.length?`<span class="end">${esc(it.end)}</span>`:"") : `<span class="ph">依次点下面的单词</span>`;
    pool.querySelectorAll(".w").forEach(b=>b.classList.toggle("used",seq.includes(+b.dataset.k)));
    slot.querySelectorAll(".w").forEach(b=>b.onclick=()=>{ seq.splice(+b.dataset.j,1); render(); });
    chk.disabled = seq.length!==it.w.length;
  };
  pool.querySelectorAll(".w").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(!seq.includes(k)){ seq.push(k); render(); } });
  chk.onclick=()=>{
    const mine=seq.map(k=>it.w[k]).join(" "), right=it.w.join(" ");
    const accept=[it.w].concat(it.alt||[]).map(a=>a.join(" "));
    const ok=accept.includes(mine);
    slot.classList.add(ok?"ok":"no");
    slot.querySelectorAll(".w").forEach(b=>b.onclick=null); pool.querySelectorAll(".w").forEach(b=>b.onclick=null);
    chk.remove();
    done(ok, mine+it.end, right+it.end, it);
  };
}
function done(ok,picked,right,it){
  S.ans.push({ok,picked,right,q:it.q,say:it.say||"",tag:it.tag});
  const last=S.i===QS.length-1;
  $("#fb").innerHTML=`
    <div class="note ${ok?"ok":"no"}">
      <h4>${ok?"答对了":"再记一记"}</h4>
      ${ok?"":`<p>正确答案　<span class="ans">${esc(right)}</span></p>`}
      <p>${esc(it.tip)}</p>
    </div>
    <button class="btn ${last?"clay":""}" id="nx">${last?"看看我的成绩单":"下一题"} <span class="arr">→</span></button>`;
  $("#nx").onclick=()=>{ if(last) report(); else { S.i++; q(); } };
  $("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function report(){
  const n=S.ans.length, r=S.ans.filter(a=>a.ok).length, score=Math.round(r/n*100);
  const suns = score>=90?3:score>=70?2:score>=50?1:0;
  const words = CFG.words[score===100?0:score>=90?1:score>=70?2:score>=50?3:4];
  const coins = score===100?3:1;
  const best=store.get(KEY+"_best",null); if(best==null||score>best) store.set(KEY+"_best",score);
  const tags=[...new Set(QS.map(x=>x.tag))];
  const sk=tags.map(t=>{const a=S.ans.filter(x=>x.tag===t);return{t,n:a.length,r:a.filter(x=>x.ok).length};});
  const wrong=S.ans.filter(a=>!a.ok);
  const d=new Date(), ds=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  app.innerHTML=`
    <section class="report rise">
      <div class="stamp"><div><i>${coins}</i><b>枚华特币</b></div></div>
      <div class="dear">${S.name?esc(S.name)+" 同学：":"同学你好："}</div>
      <div class="score"><b>${score}</b><span>分 · 答对 ${r}/${n}</span></div>
      <div class="suns" aria-label="${suns} 个太阳">${[0,1,2].map(k=>sunSvg(k<suns)).join("")}</div>
      <p class="words">${words}</p>
      <div class="skills">${sk.map(x=>`<div class="sk"><span>${x.t}</span><span class="bar"><i style="width:${x.r/x.n*100}%"></i></span><span class="n">${x.r}/${x.n}</span></div>`).join("")}</div>
      <p class="coin">截图发给老师，下次上课领取 <b>${coins} 枚华特币</b>。${coins<3?"全部答对可以拿 3 枚哦，把错题弄懂再挑战一次吧。":"全对，满分奖励！"}</p>
      <div class="sigline"><span>华特少儿英语 · ${UNIT.gradeCn} ${UNIT.label} 自查</span><span class="en">${ds}</span></div>
    </section>
    ${wrong.length?`<h3>错题回顾 · ${wrong.length} 道</h3>${wrong.map(w=>`
      <div class="wr"><div class="q">${esc(w.q)}${w.say?` <span class="en">“${esc(w.say)}”</span>`:""}</div>
      <div class="y">我的答案　<span class="${isEn(w.picked)?"en":""}">${esc(w.picked)}</span></div>
      <div class="a">正确答案　<span class="${isEn(w.right)?"en":""}">${esc(w.right)}</span></div></div>`).join("")}`:""}
    <button class="btn" id="again">再测一次</button>
    <button class="btn line" id="home">回到封面</button>`;
  $("#again").onclick=()=>{ S={i:0,ans:[],name:S.name}; q(); };
  $("#home").onclick=cover;
  window.scrollTo({top:0});
}
cover();
</script>
